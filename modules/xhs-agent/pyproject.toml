[project]
name = "xhs-agent"
version = "0.1.0"
description = "Xiaohongshu content-package generator for academic agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.0",
  "pillow>=12.0.0",
  "playwright>=1.62.0",
  "pydantic>=2.13.0",
  "uvicorn>=0.52.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[project.scripts]
xhs-agent = "xhs_agent.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
