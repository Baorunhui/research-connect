[project]
name = "xhs-agent"
version = "0.1.0"
description = "Xiaohongshu content-package generator for academic agents."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "research-connect-core==0.2.0",
  "fastapi>=0.141,<1",
  "pillow>=12,<13",
  "playwright>=1.62,<2",
  "pydantic>=2.13,<3",
  "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
]

[project.scripts]
xhs-agent = "xhs_agent.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
