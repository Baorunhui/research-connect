<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1440px; }
    body { font-family: "Inter", "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", sans-serif; }
    .card { width: 1080px; height: 1440px; background: #fafaf8; color: #0a0a0a; position: relative; overflow: hidden; padding: 84px 72px 54px; }
    .top { position: absolute; inset: 0 0 auto; height: 28px; background: #002fa7; }
    .issue { display: flex; justify-content: space-between; color: #737373; border-bottom: 2px solid #d4d4d2; padding-bottom: 28px; font: 22px "Noto Sans Mono CJK SC", monospace; }
    .issue span:last-child { color: #002fa7; }
    h1 { margin: 82px 0 0; font-size: 86px; line-height: 1.08; max-width: 930px; font-weight: 800; letter-spacing: 0; }
    .subtitle { margin: 22px 0 0; color: #002fa7; font-size: 36px; font-weight: 700; }
    .grid { margin-top: 118px; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
    .box { min-height: 288px; border-radius: 20px; padding: 34px; background: #efefed; }
    .box:nth-child(even) { background: #e5ecff; }
    .box span { font: 22px "Noto Sans Mono CJK SC", monospace; color: #002fa7; }
    .box h2 { margin: 36px 0 0; font-size: 38px; line-height: 1.22; }
    footer { position: absolute; left: 72px; right: 72px; bottom: 54px; border-top: 2px solid #d4d4d2; padding-top: 28px; color: #737373; font-size: 26px; }
  </style>
</head>
<body>
  <section class="card">
    <div class="top"></div>
    <header class="issue"><span>{{KICKER}}</span><span>{{PAGE}}/{{TOTAL}}</span></header>
    <h1>{{TITLE}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>
    <div class="grid">
      <article class="box"><span>01</span><h2>{{POINT_1}}</h2></article>
      <article class="box"><span>02</span><h2>{{POINT_2}}</h2></article>
      <article class="box"><span>03</span><h2>{{POINT_3}}</h2></article>
      <article class="box"><span>04</span><h2>{{POINT_4}}</h2></article>
    </div>
    <footer>{{FOOTER}}</footer>
  </section>
</body>
</html>
