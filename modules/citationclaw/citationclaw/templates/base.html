<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}查他引{% endblock %}</title>
    <link rel="icon" href="/static/head_logo.png">
    <link href="/static/vendor/bootstrap.min.css?v=2.1" rel="stylesheet">
    <link href="/static/vendor/bootstrap-icons.css?v=2.1" rel="stylesheet">
    <link href="/static/css/style.css?v=2.2" rel="stylesheet">
</head>
<body>
    <noscript><div style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#dc2626;color:#fff;padding:8px 16px;font:14px monospace">JavaScript 被禁用，请启用后刷新</div></noscript>
    <nav class="agent-navbar">
        <div class="agent-navbar-inner">
            <a href="/" class="agent-brand">
                <div class="agent-brand-icon">
                    <img src="/static/head_logo.png" width="28" height="28" alt="查他引" style="display:block">
                </div>
                <div>
                    <div class="agent-brand-name">查他引</div>
                    <div class="agent-brand-sub">看一篇论文被谁引用过</div>
                </div>
            </a>
            <button class="agent-navbar-toggler" type="button" aria-label="Toggle navigation" onclick="this.parentElement.querySelector('.agent-nav-links').classList.toggle('show')">
                <i class="bi bi-list"></i>
            </button>
            <div class="agent-nav-links">
                <a href="#" class="agent-nav-link" data-spa-panel="home">
                    <i class="bi bi-house-fill"></i> 首页
                </a>
                <a href="#" class="agent-nav-link" data-spa-panel="results">
                    <i class="bi bi-folder2-open"></i> 结果
                </a>
            </div>
        </div>
    </nav>

    <div class="agent-page-content">
        {% block content %}{% endblock %}
    </div>

    <footer class="agent-footer">
        <small>ustcaigroup</small>
    </footer>

    <script src="/static/vendor/bootstrap.bundle.min.js?v=2.1"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
