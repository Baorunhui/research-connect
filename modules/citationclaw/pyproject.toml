[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citationclaw"
version = "2.0.0"
description = "论文被引画像分析工具 — 自动爬取施引文献、识别著名学者、生成可视化 HTML 报告"
readme = "README.md"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
authors = [
  { name = "Qihao Yang" },
  { name = "Chunhao Zhang" },
  { name = "Yifan Cheng" },
  { name = "Ziyang Gong" },
  { name = "Caorui Li" },
  { name = "Zhanghan Xu" },
  { name = "Tianyi Zhou" },
  { name = "Jiawei Lu" },
  { name = "Ziqian Fan" },
  { name = "Yifan Zhou" },
  { name = "Yue Zhou" },
  { name = "Zhihang Zhong" },
  { name = "Xu Yang" },
  { name = "Xin Tan" },
  { name = "Xue Yang" },
]
requires-python = ">=3.11,<3.14"
keywords = ["citation", "google-scholar", "academic", "research"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "research-connect-core==0.2.0",
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.52,<1",
  "jinja2>=3.1.3,<4",
  "python-multipart>=0.0.20,<1",
  "requests>=2.31,<3",
  "httpx>=0.28,<1",
  "tqdm>=4.66,<5",
  "pandas>=2.2.3,<3",
  "openpyxl>=3.1.5,<4",
  "beautifulsoup4>=4.12.3,<5",
  "openai>=1.109.1,<2",
  "websocket-client>=1.8,<2",
  "pycookiecheat>=0.8,<1",
  "pydantic>=2.13,<3",
  "PyMuPDF>=1.24,<2",
  "playwright>=1.62,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.urls]
Homepage = "https://visionxlab.github.io/CitationClaw/"
Repository = "https://github.com/VisionXLab/CitationClaw"

[project.scripts]
citationclaw = "citationclaw.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["citationclaw*"]

[tool.setuptools.package-data]
citationclaw = [
  "static/**/*",
  "templates/**/*",
  "config/**/*",
]
