# Path router for the standalone Research Connect tools. The host reverse
# proxy terminates TLS and forwards the whole hostname here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    # The pages can start paid jobs, so the whole site sits behind one shared login.
    auth_basic "Research Connect";
    auth_basic_user_file /etc/nginx/htpasswd;

    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Authorization "";

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location = /healthz {
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /papers { return 302 /papers/; }
    # Daily Paper's static handler serves its whole module directory.
    location ~ ^/papers/(config\.ya?ml|secret\.private|\.env|\.git|src/|scripts/|sql/|tests/) {
        return 404;
    }
    # Scripts and styles are large. Compress those responses; leave the rest
    # unbuffered so chat and run logs can stream.
    location ~ ^/papers/(.+\.(?:js|css|svg|woff2))$ {
        gzip on;
        gzip_comp_level 5;
        gzip_proxied any;
        gzip_types text/css application/javascript text/javascript image/svg+xml font/woff2;
        gzip_min_length 1024;
        proxy_buffering on;
        proxy_set_header Host localhost;
        proxy_pass http://daily-paper:8567/$1$is_args$args;
    }
    location /papers/ {
        # Daily Paper's local server only answers requests addressed to localhost.
        proxy_set_header Host localhost;
        proxy_pass http://daily-paper:8567/;
    }

    location = /citations { return 302 /citations/; }
    location /citations/ {
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://citationclaw:58890/;
    }

    location = /xhs { return 302 /xhs/; }
    location /xhs/ {
        proxy_set_header Host $host;
        proxy_pass http://xhs:58891/;
    }
}
