<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Connect 工具箱</title>
  <style>
    :root { color-scheme: light; --ink: #1d2433; --muted: #5b6475; --line: #e3e7ef; --accent: #2f5bd3; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); background: #f6f7fb; }
    main { max-width: 960px; margin: 0 auto; padding: 56px 20px 40px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .lead { margin: 0 0 32px; color: var(--muted); line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    a.card { display: block; padding: 22px; background: #fff; border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; transition: border-color .15s, box-shadow .15s; }
    a.card:hover { border-color: var(--accent); box-shadow: 0 6px 18px rgba(47, 91, 211, .12); }
    .card h2 { margin: 0 0 6px; font-size: 19px; }
    .card code { font-size: 13px; color: var(--accent); }
    .card p { margin: 10px 0 0; color: var(--muted); line-height: 1.6; font-size: 14px; }
    footer { margin-top: 36px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body>
<main>
  <h1>Research Connect 工具箱</h1>
  <p class="lead">三个工具都在这台服务器上，打开就能用。</p>
  <div class="grid">
    <a class="card" href="papers/">
      <h2>论文日报</h2>
      <code>/papers/</code>
      <p>按主题找近期论文，总结一篇论文，或围绕一个题目写综述。</p>
    </a>
    <a class="card" href="citations/">
      <h2>查他引</h2>
      <code>/citations/</code>
      <p>看一篇论文被谁引用过，以及有没有熟悉的学者。查过的学者主页会直接打开上次的结果。</p>
    </a>
    <a class="card" href="xhs/">
      <h2>小红书文案</h2>
      <code>/xhs/</code>
      <p>根据论文或项目材料，写出标题、正文、标签，并生成配图。</p>
    </a>
  </div>
  <footer>论文日报的模型在页面设置里修改。查他引的接口由服务器维护，页面上不能改。生成的结果都留在这台服务器上。</footer>
</main>
</body>
</html>
