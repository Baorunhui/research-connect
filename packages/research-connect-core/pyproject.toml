[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-connect-core"
version = "0.2.0"
description = "Shared lightweight runtime for Research Connect modules"
requires-python = ">=3.11,<3.14"
dependencies = [
  "openai>=1.109.1,<2",
  "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
