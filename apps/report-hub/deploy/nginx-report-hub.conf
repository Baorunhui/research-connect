# Put this inside the nginx `http` block (normally as a file under conf.d/).
# Replace the certificate paths if TLS is terminated by this nginx instance.
server {
    listen 8443 ssl;
    server_name report.sinksilk.com;

    ssl_certificate     /etc/nginx/certs/report.sinksilk.com.crt;
    ssl_certificate_key /etc/nginx/certs/report.sinksilk.com.key;

    # Daily Paper publishes the original site together with historical figures.
    # Keep this aligned with REPORT_HUB_MAX_UPLOAD_MB.
    client_max_body_size 256m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:58787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
