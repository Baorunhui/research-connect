<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Research Connect 任务</title>
  <link rel="stylesheet" href="/assets/task.css">
</head>
<body data-token="__PUBLIC_TOKEN__">
  <main>
    <header>
      <span class="brand">RESEARCH CONNECT</span>
      <span id="connection" class="connection">正在连接</span>
    </header>
    <section class="hero">
      <div id="status" class="status queued">排队中</div>
      <h1 id="title">正在读取任务…</h1>
      <p id="meta"></p>
      <div class="progress"><div id="progress-bar"></div></div>
      <p id="current-message" class="current-message">任务已经建立，正在等待第一条进度。</p>
    </section>
    <section id="report-section" class="report-section hidden">
      <div class="section-title"><h2>结果报告</h2><a id="open-report" target="_blank">单独打开</a></div>
      <iframe id="report" title="任务结果"></iframe>
    </section>
    <section class="events-section">
      <h2>运行记录</h2>
      <ol id="events"></ol>
    </section>
  </main>
  <script src="/assets/task.js" defer></script>
</body>
</html>
