<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Research Connect 配置中心</title>
  <style>
    :root{color-scheme:light;--bg:#f4f6fa;--card:#fff;--ink:#172033;--muted:#667085;--line:#e4e8f0;--brand:#3265f6;--brand-soft:#eef4ff;--ok:#167a55;--warn:#ad6800;--bad:#c23c48;--shadow:0 12px 34px rgba(31,45,78,.075)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif}
    header{background:radial-gradient(circle at 80% -30%,#6f91ff 0,transparent 38%),linear-gradient(135deg,#15213b,#315efb);color:#fff;padding:36px max(20px,calc((100vw - 1240px)/2));box-shadow:var(--shadow)}
    header h1{margin:0 0 7px;font-size:29px;letter-spacing:-.02em}header p{margin:0;opacity:.84;max-width:820px;font-size:15px}
    main{max-width:1240px;margin:0 auto;padding:24px 18px 70px}.notice{display:flex;gap:11px;align-items:flex-start;background:#eef3ff;border:1px solid #ccdaff;border-radius:14px;padding:13px 16px;margin-bottom:25px;color:#344054}.notice b{white-space:nowrap;color:#2448a8}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:30px 0 12px}.section-head h2{font-size:21px;margin:0}.section-head p{margin:0;color:var(--muted);font-size:13px}
    .config-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.config-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;min-height:142px;box-shadow:0 5px 18px rgba(31,45,78,.045);transition:.2s ease}.config-card:hover{border-color:#c7d3ed;transform:translateY(-1px)}.config-card.flash{animation:flash 1.1s ease}.config-title{font-size:16px;font-weight:720;padding-right:76px}.config-desc{color:var(--muted);font-size:12.5px;margin:7px 0 15px}.config-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}.source-switch{display:flex;gap:7px;align-items:center;font-weight:650;font-size:12px}.source-switch input{accent-color:var(--brand)}
    .status{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 8px;border-radius:99px;background:#eef1f5;color:var(--muted);white-space:nowrap}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status.ready{background:#e8f7f0;color:var(--ok)}.status.missing{background:#fff3de;color:var(--warn)}.status.disabled{background:#f0f1f3;color:#777}.status.local{background:var(--brand-soft);color:var(--brand)}
    button{border:0;border-radius:9px;padding:8px 11px;background:#edf2ff;color:#244bc5;font:inherit;font-weight:650;cursor:pointer}button:hover{filter:brightness(.98)}button.primary{background:var(--brand);color:#fff}button.ghost{background:#f2f4f7;color:#475467}button:disabled{opacity:.5;cursor:not-allowed}.save-sources{margin-top:12px}
    .pipeline-list{display:grid;gap:15px}.pipeline{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow);overflow:hidden}.pipeline-head{display:flex;align-items:baseline;gap:11px;margin-bottom:15px}.pipeline h3{margin:0;font-size:18px}.pipeline-subtitle{color:var(--muted);font-size:12.5px}
    .flow-scroll{overflow-x:auto;padding:48px 2px 13px}.flow{display:flex;align-items:center;min-width:max-content}.flow-unit{position:relative;width:196px;flex:0 0 196px}.flow-step{width:100%;min-height:156px;border:1.5px solid #d8dde7;border-radius:14px;background:#fafbfc;padding:13px;position:relative;transition:.18s}.flow-step.ready{border-color:#78a1ff;background:linear-gradient(180deg,#f7faff,#eef4ff);box-shadow:0 4px 16px rgba(50,101,246,.09)}.flow-step.fallback{border-style:dashed}.flow-step-index{font-size:11px;font-weight:750;color:#98a2b3}.flow-step.ready .flow-step-index{color:var(--brand)}.flow-step-title{font-size:14px;font-weight:750;margin:3px 0 6px}.flow-step-desc{font-size:11.5px;color:var(--muted);line-height:1.45;min-height:49px}.flow-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.flow-chip{border:0;border-radius:6px;background:#eceff4!important;color:#667085!important;padding:3px 6px;font-size:10.5px;font-weight:650;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.flow-chip.clickable{cursor:pointer}.flow-chip.api-ready{background:#dfe9ff!important;color:#2454ca!important}.flow-chip.source-ready{background:#e4f5eb!important;color:#23714e!important}.flow-chip.api-missing,.flow-chip.source-missing{background:#eceff4!important;color:#7b8493!important}.flow-chip.clickable:hover{filter:brightness(.96)}.flow-flag{position:absolute;right:9px;top:9px;font-size:10px;padding:2px 6px;border-radius:8px;background:#fff2d8;color:#9a6000}.flow-link{width:32px;display:grid;place-items:center;position:relative;flex:0 0 32px}.flow-link:before{content:"";height:2px;width:100%;background:#d8dde7}.flow-link:after{content:"";position:absolute;right:0;border-left:6px solid #d8dde7;border-top:4px solid transparent;border-bottom:4px solid transparent}.flow-link.ready:before{background:var(--brand)}.flow-link.ready:after{border-left-color:var(--brand)}
    .flow-bypass{position:absolute;z-index:2;left:-32px;right:-32px;top:-29px;height:calc(50% + 29px);border:2px dashed #c0c7d3;border-bottom:0;border-radius:14px 14px 0 0;pointer-events:none}.flow-bypass:before{content:"可跳过";position:absolute;left:50%;top:-10px;transform:translateX(-50%);padding:0 6px;background:#fff;color:#8992a3;font-size:9px;white-space:nowrap}.flow-bypass:after{content:"";position:absolute;right:-5px;bottom:-1px;border-left:6px solid #c0c7d3;border-top:4px solid transparent;border-bottom:4px solid transparent}.flow-bypass.ready{border-color:var(--brand)}.flow-bypass.ready:before{color:var(--brand)}.flow-bypass.ready:after{border-left-color:var(--brand)}
    .flow-link{height:2px;display:block;background:#d8dde7}.flow-link:before{display:none}.flow-link.left-ready{background:linear-gradient(to right,var(--brand) 0 50%,#d8dde7 50% 100%)}.flow-link.right-ready{background:linear-gradient(to right,#d8dde7 0 50%,var(--brand) 50% 100%)}.flow-link.left-ready.right-ready{background:var(--brand)}.flow-link:after{top:50%;transform:translateY(-50%)}.flow-link.right-ready:after{border-left-color:var(--brand)}
    .flow-bypass{left:-16px;right:-16px}
    .flow-parallel{width:214px;display:grid;gap:10px;position:relative;padding:24px 0}.flow-parallel:before,.flow-parallel:after{content:"";position:absolute;left:-1px;right:-1px;height:calc(50% - 34px);border-left:2px solid #cfd5df;border-right:2px solid #cfd5df}.flow-parallel:before{top:50%;transform:translateY(-100%);border-top:2px solid #cfd5df;border-radius:10px 10px 0 0}.flow-parallel:after{bottom:50%;transform:translateY(100%);border-bottom:2px solid #cfd5df;border-radius:0 0 10px 10px}.flow-parallel .flow-step{min-height:132px;margin:0 10px;width:194px;z-index:1}.parallel-label{position:absolute;top:0;left:50%;transform:translateX(-50%);color:#667085;background:#f2f4f7;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:700;white-space:nowrap}.flow-parallel.has-ready:before,.flow-parallel.has-ready:after{border-color:var(--brand)}
    .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:3px 0 14px}.legend span{display:flex;gap:6px;align-items:center}.legend i{display:block;width:16px;height:10px;border-radius:4px;border:1.5px solid #d8dde7;background:#fafbfc}.legend .ok{border-color:#78a1ff;background:#eef4ff}.legend .fallback{border-style:dashed}.footer-note{color:var(--muted);font-size:12.5px;margin-top:26px}
    dialog{width:min(650px,calc(100vw - 28px));border:0;border-radius:18px;padding:0;box-shadow:0 30px 90px rgba(17,27,52,.28)}dialog::backdrop{background:rgba(17,27,52,.48)}.modal{padding:22px}.modal-head{display:flex;justify-content:space-between;gap:12px}.modal h3{margin:0;font-size:21px}.modal p{color:var(--muted);margin:5px 0 2px}.field{margin:13px 0}.field label{display:block;font-size:12.5px;font-weight:650;margin-bottom:5px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #ccd3df;border-radius:9px;background:#fff;font:inherit}.toggle{display:flex!important;gap:8px;align-items:center}.toggle input{width:auto}.model-row{display:grid;grid-template-columns:1fr auto;gap:8px}.modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.right{display:flex;gap:8px}.result{min-height:24px;margin-top:12px;font-size:12.5px}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}.loading{padding:50px;text-align:center;color:var(--muted)}
    @keyframes flash{0%,100%{box-shadow:0 5px 18px rgba(31,45,78,.045)}35%{box-shadow:0 0 0 5px rgba(50,101,246,.18)}}
    @media(max-width:960px){.config-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:620px){header{padding:27px 18px}.config-grid{grid-template-columns:1fr}.section-head{display:block}.section-head p{margin-top:4px}.pipeline{padding:14px}.flow-unit{width:178px;flex-basis:178px}.flow-parallel{width:196px}.flow-parallel .flow-step{width:176px}.notice{display:block}.notice b{display:block;margin-bottom:3px}.modal-actions{align-items:flex-start}.right{flex-wrap:wrap;justify-content:flex-end}}
  </style>
</head>
<body>
<header><h1>Research Connect 配置中心</h1><p>所有模块共用一份配置。先完成 API 和论文源设置，再从下方流水线检查每项功能能否完整运行。</p></header>
<main>
  <div class="notice"><b>保存后自动同步</b><span>回到飞书发送任意消息即可让 Connect Hub 拉取最新配置。本页地址本身具有配置权限，请勿转发。</span></div>
  <div id="app" class="loading">正在读取配置…</div>
</main>
<dialog id="editor"><form method="dialog" class="modal" id="editor-form"><div class="modal-head"><div><h3 id="editor-title"></h3><p id="editor-desc"></p></div><button value="cancel" class="ghost" aria-label="关闭">关闭</button></div><div id="fields"></div><div id="probe-result" class="result"></div><div class="modal-actions"><button type="button" id="probe">测试可用性</button><div class="right"><button value="cancel" class="ghost">取消</button><button type="button" class="primary" id="save">保存</button></div></div></form></dialog>
<script>
const app=document.getElementById('app'),dialog=document.getElementById('editor'),fields=document.getElementById('fields'),probeResult=document.getElementById('probe-result');
let catalog={providers:[],paper_sources:[],pipelines:[]},config={providers:{},paper_sources:{}},editing=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const def=id=>catalog.providers.find(p=>p.id===id)||{id,label:id,fields:[],secret_fields:[]};
const sourceDef=id=>(catalog.paper_sources||[]).find(s=>s.id===id)||{id,label:id};
function providerStatus(id){const d=def(id),p=config.providers[id]||{};if(p.enabled===false)return['未启用','disabled'];const secrets=d.secret_fields||[];if(secrets.length&&!d.credential_optional&&!p.configured)return['缺少凭据','missing'];if((d.fields||[]).includes('base_url')&&!p.base_url)return['缺少地址','missing'];if((d.fields||[]).includes('model')&&!p.model)return['缺少模型','missing'];return[d.credential_optional&&!p.configured?'可匿名使用':'已配置','ready']}
function sourceEnabled(source){if(source.always_ready)return true;if(source.id in (config.paper_sources||{}))return config.paper_sources[source.id]?.enabled!==false;if(source.provider)return (config.providers[source.provider]||{}).enabled!==false;return false}
function sourceStatus(id){const s=sourceDef(id);if(s.always_ready)return['免配置','ready'];if(!sourceEnabled(s))return['未启用','disabled'];if(s.provider)return providerStatus(s.provider);return['需要本地数据','missing']}
function sectionHead(title,note){return `<div class="section-head"><h2>${esc(title)}</h2><p>${esc(note)}</p></div>`}
function providerCard(p){const s=providerStatus(p.id);return `<article class="config-card" id="provider-${esc(p.id)}"><div class="config-title">${esc(p.label)}</div><div class="config-desc">${esc(p.description||'')}</div><div class="config-foot"><span class="status ${s[1]}">${s[0]}</span><button onclick="openEditor('${esc(p.id)}')">配置</button></div></article>`}
function sourceCard(s){const st=sourceStatus(s.id),checked=sourceEnabled(s),canToggle=!s.always_ready;return `<article class="config-card" id="source-${esc(s.id)}"><div class="config-title">${esc(s.label)}</div><div class="config-desc">${esc(s.description||'')}</div><div class="config-foot">${canToggle?`<label class="source-switch"><input type="checkbox" data-source="${esc(s.id)}" ${checked?'checked':''}>启用</label>`:'<span></span>'}<span class="status ${st[1]}">${st[0]}</span>${s.provider?`<button onclick="openEditor('${esc(s.provider)}')">配置</button>`:''}</div></article>`}
function stepReadyV2(step){if(step.parallel)return step.parallel.some(stepReadyV2);const providers=step.providers||[],sources=step.sources||[];if(providers.some(id=>providerStatus(id)[1]!=='ready'))return false;if(sources.some(id=>sourceStatus(id)[1]!=='ready'))return false;return !!step.local||providers.length>0||sources.length>0}
function stepChipV2(id,type){const d=type==='source'?sourceDef(id):def(id),status=type==='source'?sourceStatus(id):providerStatus(id),fn=(type==='source'?'jumpSource':'jumpProvider')+"('"+esc(id)+"')",kind=(type==='source'?'source-':'api-')+(status[1]==='ready'?'ready':'missing');return '<button class="flow-chip clickable '+kind+'" onclick="'+fn+'" title="打开'+esc(d.label)+'配置">'+(type==='source'?'源 · ':'API · ')+esc(d.label)+'</button>'}
function stepCardV2(step,index,label){const ready=stepReadyV2(step),flags=step.fallback?'降级':step.optional?'可选':'';return '<article class="flow-step '+(ready?'ready ':'')+(step.fallback?'fallback':'')+'">'+(flags?'<span class="flow-flag">'+flags+'</span>':'')+'<div class="flow-step-index">'+esc(label||('STEP '+index))+'</div><div class="flow-step-title">'+esc(step.label)+'</div><div class="flow-step-desc">'+esc(step.description)+'</div><div class="flow-badges">'+(step.providers||[]).map(id=>stepChipV2(id,'api')).join('')+(step.sources||[]).map(id=>stepChipV2(id,'source')).join('')+(step.optional_sources||[]).map(id=>stepChipV2(id,'source')).join('')+(step.local?'<span class="flow-chip api-ready">本机执行</span>':'')+'</div></article>'}
function renderPipelineV2(pipe){const states=pipe.steps.map(stepReadyV2),skips=pipe.steps.map(step=>!!(step.optional||step.fallback)),n=pipe.steps.length,prefix=Array(n+1).fill(false),suffix=Array(n+1).fill(false);prefix[0]=true;for(let i=0;i<n;i++)prefix[i+1]=prefix[i]&&(states[i]||skips[i]);suffix[n]=true;for(let i=n-1;i>=0;i--)suffix[i]=suffix[i+1]&&(states[i]||skips[i]);const through=states.map((ready,i)=>ready&&prefix[i]&&suffix[i+1]),bypass=skips.map((skip,i)=>skip&&prefix[i]&&suffix[i+1]);let flow='';pipe.steps.forEach((step,i)=>{if(i)flow+='<span class="flow-link '+(through[i-1]?'left-ready ':'')+(through[i]?'right-ready':'')+'"></span>';if(step.parallel){flow+='<div class="flow-parallel '+(through[i]?'has-ready':'')+'"><span class="parallel-label">'+esc(step.parallel_label||'并行')+'</span>'+step.parallel.map((lane,j)=>stepCardV2(lane,i+1,'STEP '+(i+1)+(j?'B':'A'))).join('')+'</div>';return}const showBypass=skips[i]&&i>0&&i<n-1;flow+='<div class="flow-unit">'+(showBypass?'<span class="flow-bypass '+(bypass[i]?'ready':'')+'" title="可跳过此步骤"></span>':'')+stepCardV2(step,i+1)+'</div>'});return '<section class="pipeline"><div class="pipeline-head"><h3>'+esc(pipe.title)+'</h3><span class="pipeline-subtitle">'+esc(pipe.subtitle||'')+'</span></div><div class="flow-scroll"><div class="flow">'+flow+'</div></div></section>'}
function render(){
  const sourceProviderIds=new Set((catalog.paper_sources||[]).map(s=>s.provider).filter(Boolean));
  const apiProviders=catalog.providers.filter(p=>!sourceProviderIds.has(p.id));
  let html=sectionHead('API 配置','每项只配置一次，飞书与三个功能模块共同使用。')+`<div class="config-grid">${apiProviders.map(providerCard).join('')}</div>`;
  html+=sectionHead('论文源配置','统一管理日报、综述和查引用会读取的全部外部论文源。')+`<div class="config-grid">${(catalog.paper_sources||[]).map(sourceCard).join('')}</div><button class="primary save-sources" onclick="saveSources()">保存论文源选择</button>`;
  html+=sectionHead('功能流水线','蓝色表示该步骤当前可用；灰色表示缺少配置，跨越连线表示此步骤可跳过。')+'<div class="legend"><span><i class="ok"></i>当前可用</span><span><i></i>需要配置</span><span><i class="fallback"></i>降级或可选步骤</span></div><div class="pipeline-list">'+catalog.pipelines.map(renderPipelineV2).join('')+'</div>';
  html+='<p class="footer-note">飞书 App Secret 和 Report Hub Agent Token 属于启动凭据，仍由部署机器上的 .env 管理，避免运行中误改连接。</p>';app.className='';app.innerHTML=html;
}
window.jumpProvider=id=>{const el=document.getElementById('provider-'+id)||document.getElementById('source-'+(catalog.paper_sources.find(s=>s.provider===id)?.id||''));if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}setTimeout(()=>openEditor(id),280)};
window.jumpSource=id=>{const s=sourceDef(id),el=document.getElementById('source-'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}if(s.provider)setTimeout(()=>openEditor(s.provider),280)};
function fieldMarkup(d,p,name){if(name==='enabled')return `<div class="field"><label class="toggle"><input name="enabled" type="checkbox" ${p.enabled!==false?'checked':''}>启用这个 Provider</label></div>`;const secret=(d.secret_fields||[]).includes(name),labels={base_url:'API 端点',model:'模型名称',api_key:'API Key',anon_key:'Anon / Publishable Key',papers_table:'论文表名',bm25_rpc:'BM25 RPC',vector_rpc:'向量 RPC',email:'联系邮箱'};if(name==='model'&&d.kind==='llm'){const current=esc(p.model||'');return `<div class="field"><label>${labels.model}</label><div class="model-row"><select name="model"><option value="${current}">${current||'请先获取模型列表'}</option></select><button type="button" id="load-models">获取模型列表</button></div></div>`}return `<div class="field"><label>${esc(labels[name]||name)}</label><input name="${esc(name)}" type="${secret?'password':'text'}" value="${secret?'':esc(p[name]||'')}" placeholder="${secret&&p.configured?'已配置，留空保持不变':''}"></div>`}
async function probeCurrent(){const r=await fetch(`api/probe/${encodeURIComponent(editing)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:formValue()})}),data=await r.json();if(!r.ok)throw Error(data.detail||data.error||'测试失败');return data}
async function loadModels(quiet){const btn=document.getElementById('load-models'),select=fields.querySelector('[name="model"]'),current=select?.value||'';if(btn)btn.disabled=true;if(!quiet)showResult('正在读取模型列表…',true);try{const data=await probeCurrent();const models=Array.isArray(data.models)?data.models:[];if(!models.length)throw Error('端点没有返回可选模型');select.innerHTML=models.map(m=>`<option value="${esc(m)}" ${m===current?'selected':''}>${esc(m)}</option>`).join('');if(current&&!models.includes(current))select.insertAdjacentHTML('afterbegin',`<option value="${esc(current)}" selected>${esc(current)}（当前）</option>`);showResult(`已获取 ${models.length} 个模型`,true)}catch(e){showResult(e.message,false)}finally{if(btn)btn.disabled=false}}
document.getElementById('save').onclick=async()=>{const value=formValue();setBusy(true);try{const r=await fetch('api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({providers:{[editing]:value}})}),data=await r.json();if(!r.ok)throw Error(data.detail||data.error||'保存失败');await load();dialog.close()}catch(e){showResult(e.message,false)}finally{setBusy(false)}};
document.getElementById('probe').onclick=async()=>{setBusy(true);showResult('正在发起最小测试请求…',true);try{const data=await probeCurrent();showResult(`${data.message||data.status}${data.latency_ms!=null?'（'+data.latency_ms+' ms）':''}`,!!data.ok)}catch(e){showResult(e.message,false)}finally{setBusy(false)}};
window.openEditor=id=>{editing=id;const d=def(id),p=config.providers[id]||{},isSource=(catalog.paper_sources||[]).some(s=>s.provider===id);document.getElementById('editor-title').textContent=d.label;document.getElementById('editor-desc').textContent=d.description||'';fields.innerHTML=(d.fields||[]).filter(name=>!(isSource&&name==='enabled')).map(name=>fieldMarkup(d,p,name)).join('');probeResult.textContent='';probeResult.className='result';dialog.showModal();const btn=document.getElementById('load-models');if(btn){btn.onclick=()=>loadModels(false);if(p.base_url&&p.configured)setTimeout(()=>loadModels(true),80)}};
function formValue(){const d=def(editing),out={};for(const name of d.fields||[]){const el=fields.querySelector('[name="'+name+'"]');if(!el)continue;out[name]=name==='enabled'?!!el.checked:el.value.trim()}return out}
function setBusy(v){document.getElementById('save').disabled=v;document.getElementById('probe').disabled=v;const b=document.getElementById('load-models');if(b)b.disabled=v}function showResult(t,ok){probeResult.textContent=t;probeResult.className='result '+(ok?'ok':'bad')}
window.saveSources=async()=>{const body={paper_sources:{},providers:{}};document.querySelectorAll('[data-source]').forEach(el=>{const s=sourceDef(el.dataset.source),enabled=!!el.checked;if(el.dataset.source in (config.paper_sources||{})||['arxiv','deepxiv','kaggle'].includes(el.dataset.source))body.paper_sources[el.dataset.source]={enabled};if(s.provider)body.providers[s.provider]={enabled}});const r=await fetch('api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){await load();alert('论文源选择已保存')}else alert('保存失败')};
async function load(){const [c1,c2]=await Promise.all([fetch('api/catalog'),fetch('api/config')]);if(!c1.ok||!c2.ok)throw Error('配置服务不可用');catalog=await c1.json();config=await c2.json();render()}
load().catch(e=>{app.textContent='加载失败：'+e.message});
</script>
</body></html>
