[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-connect-report-hub"
version = "0.1.0"
description = "Lightweight public progress and report host for Research Connect"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.141,<1",
  "python-dotenv>=1.2,<2",
  "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=9,<10"]

[project.scripts]
report-hub = "report_hub.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
report_hub = ["static/*"]
