[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-connect-hub"
version = "0.1.0"
description = "Lightweight Feishu connector and OpenAI-compatible LLM gateway"
requires-python = ">=3.11,<3.14"
dependencies = [
  "research-connect-core==0.2.0",
  "lark-oapi==1.7.2",
  "openai>=1.109.1,<2",
  "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
connect-hub = "connect_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
